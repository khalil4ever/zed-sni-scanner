services:
  - type: web
    name: zed-sni-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.main
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONITOR_CHANNEL_ID
        value: ""
      - key: DATABASE_PATH
        value: zed_sni.db
